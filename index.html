<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Utilization Calculator</title>
<style>
  body {
    font-family: "Cairo", sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    background: #fff;
    padding: 25px 30px;
    border-radius: 15px;
    box-shadow: 0px 6px 15px rgba(0,0,0,0.15);
    width: 500px;
  }
  .logo {
    text-align: center;
    margin-bottom: 15px;
  }
  .logo img {
    max-width: 120px;
  }
  h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
  }
  label { display: block; margin: 10px 0 5px; }
  input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 8px; }
  button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    background: #2575fc;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #1b5edb; }
  .result {
    margin-top: 20px;
    font-size: 16px;
    text-align: center;
    font-weight: bold;
    color: #333;
    background: #f7f7f7;
    padding: 15px;
    border-radius: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <img src="https://i.ibb.co/3mJxZPZ/app-logo.png" alt="App Logo">
  </div>
  <h2>Utilization Calculator</h2>

  <label for="employee">Employee Name:</label>
  <input type="text" id="employee" placeholder="Enter employee name">

  <label for="workedHours">Worked Hours:</label>
  <input type="number" id="workedHours" placeholder="e.g., 8">

  <label for="breakHours">Break Hours:</label>
  <input type="number" id="breakHours" placeholder="e.g., 1">

  <button onclick="calculateUtilization()">📊 Calculate</button>

  <div class="result" id="result"></div>
</div>

<script>
const url = "https://script.google.com/macros/s/AKfycbw4lKeDXLul2_L8P6fd3__NLfJCWERzZEDUcullYekmO_EXWMJ_UwUUJ-TKjX79KbuL/exec";
let sheetData = [];

// Load data from Google Sheet
async function loadData() {
  try {
    const response = await fetch(url);
    sheetData = await response.json();
  } catch (err) {
    console.error("❌ Error loading data:", err);
  }
}

// Calculate utilization
function calculateUtilization() {
  const name = document.getElementById("employee").value.trim();
  const workedHours = parseFloat(document.getElementById("workedHours").value);
  const breakHours = parseFloat(document.getElementById("breakHours").value);
  const resultDiv = document.getElementById("result");

  if (!name || isNaN(workedHours) || isNaN(breakHours)) {
    resultDiv.innerHTML = "⚠️ Please enter all fields.";
    return;
  }

  const rows = sheetData.filter(r => r[0] && r[0].toLowerCase() === name.toLowerCase());
  if (rows.length === 0) {
    resultDiv.innerHTML = "⚠️ Employee not found in sheet.";
    return;
  }

  let totalDuration = 0;
  let totalCalls = 0;
  let totalAnswer = 0;
  let totalNotAnswer = 0;

  rows.forEach(r => {
    const duration = parseFloat(r[1]) || 0;  // Call Duration
    const calls = parseInt(r[2]) || 0;       // Calls Count
    const answer = parseInt(r[4]) || 0;      // Answer
    const notAnswer = parseInt(r[5]) || 0;   // Not Answer

    totalDuration += duration;
    totalCalls += calls;
    totalAnswer += answer;
    totalNotAnswer += notAnswer;
  });

  // Add buffer time
  const bufferFromAnswer = totalAnswer * (5 / 60); // 5 minutes = 0.083 hr
  const bufferFromNotAnswer = totalNotAnswer * (2 / 60); // 2 minutes = 0.033 hr
  const adjustedDuration = totalDuration + bufferFromAnswer + bufferFromNotAnswer;

  const netHours = workedHours - breakHours;
  const utilization = netHours > 0 ? (adjustedDuration / netHours) * 100 : 0;

  resultDiv.innerHTML = `
    👤 Employee: ${name}<br>
    ⏱️ Call Duration: ${totalDuration.toFixed(2)} hrs<br>
    📞 Calls: ${totalCalls}<br>
    ✅ Answered: ${totalAnswer} (added ${bufferFromAnswer.toFixed(2)} hrs)<br>
    ❌ Not Answered: ${totalNotAnswer} (added ${bufferFromNotAnswer.toFixed(2)} hrs)<br>
    🕒 Net Hours: ${netHours}<br>
    📊 Utilization: ${utilization.toFixed(2)}%
  `;
}

loadData();
</script>
</body>
</html>
